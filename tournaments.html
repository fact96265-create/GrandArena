<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tournaments | Grand Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h2>🏆 Tournaments</h2>
    <p style="font-size:14px;opacity:0.8">
      Join or Create Your Own Tournament
    </p>
  </div>

  <div class="container">

    <!-- CREATE TOURNAMENT -->
    <div class="card">
      <h3>➕ Create Tournament</h3>

      <input type="text" id="title" placeholder="Tournament Title">
      <input type="number" id="entryFee" placeholder="Entry Fee (₹)">
      <input type="number" id="maxPlayers" placeholder="Max Players">

      <button onclick="createTournament()">Create Tournament</button>

      <p style="font-size:13px;margin-top:8px;line-height:1.6">
        ✔ 20% admin commission<br>
        ✔ Fake tournament = ban
      </p>
    </div>

    <!-- TOURNAMENT LIST -->
    <div class="card">
      <h3>🎯 Available Tournaments</h3>
      <div id="tournamentList">Loading...</div>
    </div>

    <!-- FOOTER -->
    <div class="card" style="text-align:center;font-size:13px">
      <a href="index.html">🏠 Home</a> |
      <a href="wallet.html">💼 Wallet</a> |
      <a href="support.html">24×7 Support</a>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script src="js/supabase.js"></script>

  <script>
    async function loadTournaments() {
      const { data } = await supabase
        .from("tournaments")
        .select("*")
        .order("created_at", { ascending: false });

      const list = document.getElementById("tournamentList");
      list.innerHTML = "";

      if (!data || data.length === 0) {
        list.innerHTML = "<p>No tournaments available</p>";
        return;
      }

      data.forEach(t => {
        list.innerHTML += `
          <div class="card" style="margin-top:10px">
            <b>${t.title}</b><br>
            Entry: ₹${t.entry_fee}<br>
            Players: ${t.joined_players}/${t.max_players}<br>
            Prize Pool: ₹${t.prize_pool}<br>
            <button onclick="joinTournament('${t.id}', ${t.entry_fee})">
              Join
            </button>
          </div>
        `;
      });
    }

    async function createTournament() {
      const title = document.getElementById("title").value;
      const entryFee = Number(document.getElementById("entryFee").value);
      const maxPlayers = Number(document.getElementById("maxPlayers").value);

      if (!title || entryFee <= 0 || maxPlayers <= 1) {
        alert("Fill all fields correctly");
        return;
      }

      const adminCut = entryFee * maxPlayers * 0.20;
      const prizePool = entryFee * maxPlayers * 0.80;

      await supabase.from("tournaments").insert([{
        title: title,
        entry_fee: entryFee,
        max_players: maxPlayers,
        joined_players: 0,
        prize_pool: prizePool,
        admin_cut: adminCut,
        status: "open"
      }]);

      alert("Tournament created successfully");
      loadTournaments();
    }

    async function joinTournament(id, fee) {
      alert("₹" + fee + " will be deducted from wallet after admin approval.");

      await supabase.from("tournament_joins").insert([{
        tournament_id: id,
        status: "pending"
      }]);
    }

    loadTournaments();
  </script>

</body>
</html>

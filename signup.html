<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Grand Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <meta name="description" content="Create your Grand Arena account and start competitive gaming">
  <meta name="author" content="Grand Arena">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h2>📝 Create Account</h2>
    <p style="font-size:14px;opacity:0.8">
      Join Grand Arena & play skill-based tournaments
    </p>
  </div>

  <!-- SIGNUP FORM -->
  <div class="container">

    <div class="card">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username">

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter email">

      <label>Password</label>
      <input type="password" id="password" placeholder="Create password">

      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password">

      <button onclick="signup()">Create Account</button>

      <p style="font-size:13px;text-align:center;margin-top:10px">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>

    <!-- RULES -->
    <div class="card">
      <p style="font-size:13px;line-height:1.6">
        ✔ Minimum age 18+<br>
        ✔ One account per player<br>
        ✔ Fake details lead to permanent ban<br>
        ✔ By signing up you agree to our
        <a href="terms.html">Terms & Conditions</a>
      </p>
    </div>

    <!-- FOOTER -->
    <div class="card" style="text-align:center;font-size:13px">
      <a href="index.html">🏠 Home</a> |
      <a href="privacy.html">Privacy</a> |
      <a href="support.html">24×7 Support</a>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
